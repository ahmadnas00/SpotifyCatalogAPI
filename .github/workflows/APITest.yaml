name: SpotifyCatalogAPI Testing

on:
  workflow_dispatch:

jobs:
  API_Tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: mvn install -DskipTests

      - name: Run API Tests
        run: mvn test -Dtest="services.JSONDataSourcesServiceTest,services.SpotifyAPIDataSourcesTest"
